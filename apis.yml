name: Caremessage
description: >-
  CareMessage is a healthcare technology non-profit that operates one of the
  largest patient engagement platforms serving low-income and underserved
  populations across the United States. Since 2013 the platform has reached more
  than 20 million patients and is used by roughly 1 in 7 federally qualified
  health centers plus 200+ free clinics. Its products include 1:1 direct
  messaging, appointment lifecycle messaging, population outreach, health
  coaching, closed-loop referrals, Social Determinants of Health (SDOH)
  workflows, and Wellness Copilot, an AI-backed diabetes-management automation.
  CareMessage does not currently publish a public developer API, SDK, or API
  reference; access to the platform is through its web application and a
  login-gated help center. This profile was surfaced as a Y Combinator portfolio
  company and enriched from CareMessage's public web surface.
